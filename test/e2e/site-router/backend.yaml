# The target behind A for the routed source-preservation check. agnhost netexec
# answers /clientip with the address of whoever called, so the suite can see
# that B's own source reaches it, with no NAT in between.
#
# It is made after the routes are programmed, so the network gives it the return
# route to B's site when it is created: routes reach a pod only at creation.
apiVersion: v1
kind: Pod
metadata:
  name: site-router-backend
  labels:
    app: site-router-backend
spec:
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.47@sha256:cc249acbd34692826b2b335335615e060fdb3c0bca4954507aa3a1d1194de253
      args: ["netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: site-router-backend
spec:
  selector:
    app: site-router-backend
  ports:
    - port: 8080
      targetPort: 8080
