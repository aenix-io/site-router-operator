---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: siterouters.siterouter.aenix.io
spec:
  group: siterouter.aenix.io
  names:
    kind: SiteRouter
    listKind: SiteRouterList
    plural: siterouters
    singular: siterouter
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.tunnelAddress
      name: Tunnel Address
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SiteRouter is a routed site-to-site IPsec gateway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state.
            properties:
              bgp:
                description: bgp configures BGP between the gateway and the remote
                  site.
                properties:
                  enabled:
                    description: enabled turns BGP on.
                    type: boolean
                  localASN:
                    description: localASN is the autonomous system number of the gateway.
                    format: int64
                    maximum: 4294967295
                    minimum: 1
                    type: integer
                  neighbors:
                    description: neighbors are the BGP peers.
                    items:
                      description: BGPNeighbor is a BGP peer of the gateway.
                      properties:
                        address:
                          description: address is the address of the peer.
                          maxLength: 15
                          type: string
                          x-kubernetes-validations:
                          - message: must be an IPv4 address
                            rule: isIP(self) && ip(self).family() == 4
                        remoteASN:
                          description: remoteASN is the autonomous system number of
                            the peer.
                          format: int64
                          maximum: 4294967295
                          minimum: 1
                          type: integer
                      required:
                      - address
                      - remoteASN
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - address
                    x-kubernetes-list-type: map
                type: object
                x-kubernetes-validations:
                - message: localASN is required when bgp.enabled is true
                  rule: '!has(self.enabled) || !self.enabled || has(self.localASN)'
              peer:
                description: peer is the remote end of the tunnel.
                properties:
                  address:
                    description: |-
                      address is the IP address or DNS name of the remote end. It stays empty
                      while the address is not known, for example when the remote side is to
                      call first.
                    maxLength: 253
                    pattern: ^[A-Za-z0-9.:-]*$
                    type: string
                  auth:
                    description: auth says how the tunnel is authenticated.
                    properties:
                      secretRef:
                        description: |-
                          secretRef names a Secret that holds the pre-shared key under the key
                          "psk". When it is not set, the operator creates the Secret.
                        properties:
                          name:
                            description: name is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              remoteCIDRs:
                description: |-
                  remoteCIDRs are the networks behind the remote end. Traffic to them is
                  routed to the gateway, and traffic from them is let through to the tenant.
                items:
                  description: |-
                    IPv4CIDR is an IPv4 network in canonical form that is not the default route.

                    The length limit is what lets the apiserver bound the cost of the rules.
                  maxLength: 18
                  type: string
                  x-kubernetes-validations:
                  - message: must be an IPv4 CIDR
                    rule: isCIDR(self) && cidr(self).ip().family() == 4
                  - message: a default route (/0) is not allowed
                    rule: '!isCIDR(self) || cidr(self).prefixLength() > 0'
                  - message: host bits must be zero (use the network address)
                    rule: '!isCIDR(self) || string(cidr(self).masked()) == self'
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              resources:
                default: {}
                description: resources are the CPU and memory of the gateway VM.
                properties:
                  cpu:
                    default: 2
                    description: cpu is the number of virtual CPUs.
                    format: int32
                    minimum: 1
                    type: integer
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 2Gi
                    description: memory is the amount of memory.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              staticRoutes:
                description: staticRoutes are routes inside the gateway.
                items:
                  description: StaticRoute is a route inside the gateway.
                  properties:
                    destination:
                      description: destination is the network the route leads to.
                      maxLength: 18
                      type: string
                      x-kubernetes-validations:
                      - message: must be an IPv4 CIDR
                        rule: isCIDR(self) && cidr(self).ip().family() == 4
                      - message: a default route (/0) is not allowed
                        rule: '!isCIDR(self) || cidr(self).prefixLength() > 0'
                      - message: host bits must be zero (use the network address)
                        rule: '!isCIDR(self) || string(cidr(self).masked()) == self'
                    nextHop:
                      description: nextHop is where traffic for the destination is
                        sent.
                      maxLength: 15
                      type: string
                      x-kubernetes-validations:
                      - message: must be an IPv4 address
                        rule: isIP(self) && ip(self).family() == 4
                  required:
                  - destination
                  - nextHop
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - destination
                x-kubernetes-list-type: map
              storageClass:
                description: |-
                  storageClass is the storage class of the gateway disk. It cannot be
                  changed after creation, and cannot be set later if it was left empty.
                maxLength: 253
                type: string
            required:
            - peer
            type: object
            x-kubernetes-validations:
            - message: storageClass is immutable
              rule: has(self.storageClass) == has(oldSelf.storageClass) && (!has(self.storageClass)
                || self.storageClass == oldSelf.storageClass)
          status:
            description: status is the observed state.
            properties:
              conditions:
                description: |-
                  conditions describe the state of the gateway. The types are the
                  Condition* constants of this package.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              engine:
                description: engine says what runs inside the gateway.
                properties:
                  imageDigest:
                    description: imageDigest is the digest of the image the gateway
                      booted from.
                    type: string
                  name:
                    description: name is the name of the engine.
                    type: string
                  version:
                    description: version is the version of the appliance image.
                    type: string
                type: object
              observedGeneration:
                description: observedGeneration is the generation the conditions were
                  computed for.
                format: int64
                type: integer
              pskSecretRef:
                description: pskSecretRef names the Secret that holds the pre-shared
                  key.
                properties:
                  name:
                    description: name is the name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              tunnelAddress:
                description: |-
                  tunnelAddress is the address of the gateway as the remote side sees it.
                  It is what the remote side is configured to connect to, and the IKE
                  identity of the gateway.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 40 characters
          rule: size(self.metadata.name) <= 40
    served: true
    storage: true
    subresources:
      status: {}
