{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "site-router-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-router-operator.labels" . | nindent 4 }}
spec:
  {{- if not (kindIs "string" .Values.podDisruptionBudget.minAvailable) }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable | quote }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "site-router-operator.selectorLabels" . | nindent 6 }}
{{- end }}
