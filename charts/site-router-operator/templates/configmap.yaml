apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "site-router-operator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-router-operator.labels" . | nindent 4 }}
data:
  {{ include "site-router-operator.configKey" . }}: |
    {{- include "site-router-operator.config" . | nindent 4 }}
