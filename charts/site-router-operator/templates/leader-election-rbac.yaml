{{- if .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "site-router-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-router-operator.labels" . | nindent 4 }}
rules:
  # The Lease is read by every replica, made by the first and renewed by the
  # leader; nothing else is done to it.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  # Leader election says who took the Lease with an event of the core API, not
  # of events.k8s.io, which is what the controller records with.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "site-router-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-router-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "site-router-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "site-router-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
