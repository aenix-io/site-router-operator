# Where gateways run and how their disks are stored, with the identity of the
# operator under cilium named and not filled in by the chart.
config:
  managementCIDR: 10.244.0.0/16
  clusterNetworks:
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/16
  engine:
    name: appliance
    versions:
      - name: "1.0"
        image: registry.example/disk:1.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    latest: "1.0"
  gateway:
    isolation:
      mode: cilium
      controller:
        namespace: platform-operators
        labels:
          app: site-router
      egressDenyCIDRs:
        - 10.0.0.0/8
    vm:
      podLabels:
        team: network
      nodeSelector:
        node-role.example/gateways: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateways
          effect: NoSchedule
      priorityClassName: system-cluster-critical
    dataVolume:
      storageClass: replicated
      blockSize:
        logical: 512
        physical: 4096
      source:
        pullMethod: node
    service:
      loadBalancerClass: example.com/lb
      annotations:
        lb.example/pool: public
  timing:
    forwarderNotResponding: 2m
    poll: 1m
    discovery: 30s
