# The lease that lets one replica of the connector write at a time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-ovn-connector-leader-election
  namespace: site-router-kube-ovn-connector
  labels:
    app.kubernetes.io/name: kube-ovn-connector
    app.kubernetes.io/part-of: site-router-operator
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
