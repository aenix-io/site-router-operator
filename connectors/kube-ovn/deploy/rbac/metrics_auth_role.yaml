# What the metrics endpoint needs to ask the apiserver who calls it and whether
# they may read the metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-ovn-connector-metrics-auth
  labels:
    app.kubernetes.io/name: kube-ovn-connector
    app.kubernetes.io/part-of: site-router-operator
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
