# Bind this to whoever scrapes the metrics of the connector.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-ovn-connector-metrics-reader
  labels:
    app.kubernetes.io/name: kube-ovn-connector
    app.kubernetes.io/part-of: site-router-operator
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
