name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# A tag is released once; a second run for it waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aenix-io/site-router-operator
  CHART_REPOSITORY: oci://ghcr.io/aenix-io/charts
  HELM_VERSION: v4.3.0

jobs:
  version:
    permissions: {}
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The chart needs a semantic version, and the image and the chart carry the
      # same one, without the v of the tag.
      - name: Take the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag: vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    permissions:
      contents: read
      packages: write
      # Keyless signing: the OIDC token of this workflow is the identity the
      # signature is issued to.
      id-token: write
    name: Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The Dockerfile cross-compiles, so no platform is emulated.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The digest is signed, not the tag, which can be moved.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    needs: [version, image]
    permissions:
      contents: read
      packages: write
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint the chart
        run: make helm-lint

      # The chart that is published runs the image that was signed, by its digest,
      # and not whatever the tag points at later.
      - name: Package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          values=charts/site-router-operator/values.yaml
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the image job gave no digest: '$DIGEST'"
            exit 1
          fi
          if [ "$(grep -c '^  digest: ""$' "$values")" -ne 1 ]; then
            echo "::error::$values has no single empty image.digest to set"
            exit 1
          fi
          sed "s|^  digest: \"\"\$|  digest: \"${DIGEST}\"|" "$values" > "$values.new"
          mv "$values.new" "$values"
          helm package charts/site-router-operator --version "$VERSION" --app-version "$VERSION" --destination dist
          image=$(helm template release "dist/site-router-operator-${VERSION}.tgz" \
            --values charts/site-router-operator/ci/minimal-values.yaml \
            --show-only templates/deployment.yaml | grep -E '^ +image: ')
          if [[ "$image" != *"${IMAGE}:${VERSION}@${DIGEST}"* ]]; then
            echo "::error::the packaged chart runs $image, not ${IMAGE}:${VERSION}@${DIGEST}"
            exit 1
          fi

      - name: Push the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/site-router-operator-${VERSION}.tgz" "$CHART_REPOSITORY"
